# Tham số engine. Ghi đè bằng --set key=value. Giá trị là điểm khởi đầu; chỗ nào đã đo thì ghi số DECISIONS.
draft_min: assignee            # assignee | assignee_due
window_k: 10                   # số tin trước trong LỊCH SỬ GẦN
reply_chain_max: 3
context_token_budget: 3500
message_max_tokens: 80
quiet_seconds: 60             # lượt = tin đến liền nhau tới khi hội thoại yên 60 giây
max_wait_seconds: 300
max_batch_messages: 10
candidate_ttl_hours: 48
draft_ttl_days: 7
approved_grace_days: 3
undated_open_days: 14
declined_suppress_days: 7
llm_max_retries: 2

# Ngữ cảnh: ba tầng task (v6 mục 6).
linked_tasks_max: 3                  # task được link (reply vào tin bằng chứng)
linked_evidence_per_task: 3
search_lookup_days: 30               # phạm vi task được link
detail_recent_max: 3                 # TASK_DETAILS: task mở nhắc gần nhất
detail_similar_max: 2                # TASK_DETAILS: task mở gần nghĩa nhất (embedding, chỉ xếp hạng)
index_tasks_max: 30                  # TASK_INDEX: tối đa số dòng
index_overflow_max: 5                # TASK_INDEX tràn: chỗ cuối cho task gần nghĩa nhất trong phần bị cắt
prompt_cache_key: ai_reminder_extract
members_max: 30                      # <MEMBERS>: hội thoại đông hơn chỉ liệt kê người có mặt trong prompt

# Bảng giá USD / 1M token để ước tính chi phí (input, input được cache, output).
pricing:
  gpt-4.1-mini: {input: 0.40, cached: 0.10, output: 1.60}
  gpt-4.1-nano: {input: 0.10, cached: 0.025, output: 0.40}
  gpt-4o-mini: {input: 0.15, cached: 0.075, output: 0.60}
  deepseek-ai/DeepSeek-V4.1-Flash-1017: {input: 0.12, cached: 0.0024, output: 0.48}  # River, 11/2026
  text-embedding-3-small: {input: 0.02, cached: 0, output: 0}
